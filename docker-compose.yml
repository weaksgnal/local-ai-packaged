# local-ai — trimmed 2026-09-28 (Ian): the stack is Open WebUI + SearXNG.
# Retired in this pass (see CLAUDE.md for the evidence):
#   n8n + postgres + minio (n8n held zero workflows), caddy (no hostnames, zero
#   requests in 10 days; both services publish their own ports), the profile-gated
#   ollama-* services (Brain 10.0.0.1 / Voice 10.0.0.3 are the Ollama hosts),
#   flowise/langfuse/neo4j/qdrant/supabase (retired earlier, residue removed).
# Full previous file: git show f15c47b:docker-compose.yml

volumes:
  open-webui:

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    container_name: open-webui
    expose:
      - 8080/tcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    expose:
      - 8080/tcp
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
